<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banking Service Supply Chain – Slideshow</title>
  <meta name="description" content="Banking Service Supply Chain – interactive page-by-page slideshow." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --accent: #6382ff;
      --accent2: #a259ff;
      --bg: #0a0c14;
      --glass: rgba(15, 20, 40, 0.82);
      --border: rgba(99,130,255,0.22);
      --text: #e8eaf6;
      --muted: #8892b0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
    }

    /* ── Full-screen layout ── */
    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 16px;
      background: var(--glass);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      z-index: 20;
    }

    .title-block { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .title-block h1 {
      font-size: 0.85rem; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      background: linear-gradient(135deg,#fff 30%,#a0b4ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .title-block span { font-size: 0.68rem; color: var(--muted); }

    .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .share-row {
      display: flex; align-items: center;
      background: rgba(99,130,255,0.08);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .share-row input {
      background: transparent; border: none; outline: none;
      color: var(--muted); font-family: inherit;
      font-size: 0.72rem; padding: 5px 10px;
      width: 200px; max-width: 38vw;
    }
    .copy-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; color: #fff;
      padding: 6px 12px; font-size: 0.72rem; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      transition: opacity .2s;
    }
    .copy-btn:hover { opacity: 0.82; }

    /* ── Slide canvas area (fills remaining height) ── */
    #slide-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--bg);
    }

    /* subtle radial glow */
    #slide-area::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, rgba(99,130,255,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    #pdf-canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      transition: opacity 0.3s ease;
    }
    #pdf-canvas.fading { opacity: 0; }

    /* Loading overlay */
    #loader {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: var(--bg); z-index: 5;
      transition: opacity 0.4s;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(99,130,255,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p { color: var(--muted); font-size: 0.82rem; }

    /* ── Bottom control bar ── */
    #controls {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--glass);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
      z-index: 20;
      flex-wrap: wrap;
    }

    .nav-btn {
      display: flex; align-items: center; gap: 5px;
      background: rgba(99,130,255,0.08);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 7px 14px;
      font-family: inherit; font-size: 0.8rem; font-weight: 500;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .15s;
      white-space: nowrap;
    }
    .nav-btn:hover:not(:disabled) {
      background: rgba(99,130,255,0.18);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .nav-btn:active:not(:disabled) { transform: translateY(0); }
    .nav-btn:disabled { opacity: 0.28; cursor: not-allowed; }

    .page-pill {
      background: linear-gradient(135deg, rgba(99,130,255,0.15), rgba(162,89,255,0.12));
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 0.82rem; font-weight: 600;
      min-width: 90px; text-align: center;
      cursor: pointer;
      position: relative;
    }

    /* Progress bar */
    #prog-wrap {
      flex-shrink: 0;
      height: 3px;
      background: rgba(99,130,255,0.1);
    }
    #prog-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .4s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }

    /* ── Thumbnail drawer ── */
    #thumb-drawer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(10,12,20,0.97);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(16px);
      padding: 12px 16px 16px;
      transform: translateY(100%);
      transition: transform .35s cubic-bezier(.4,0,.2,1);
      z-index: 100;
      max-height: 40vh;
    }
    #thumb-drawer.open { transform: translateY(0); }
    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .drawer-header span { font-size: 0.75rem; font-weight: 600; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
    .close-drawer {
      background: none; border: none; color: var(--muted);
      font-size: 1.1rem; cursor: pointer; padding: 2px 8px;
      border-radius: 6px; transition: color .2s;
    }
    .close-drawer:hover { color: var(--text); }
    .thumb-scroll {
      display: flex; gap: 8px;
      overflow-x: auto; padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(99,130,255,0.3) transparent;
    }
    .thumb-scroll::-webkit-scrollbar { height: 3px; }
    .thumb-scroll::-webkit-scrollbar-thumb { background: rgba(99,130,255,0.3); border-radius: 100px; }
    .thumb {
      flex-shrink: 0; width: 88px;
      cursor: pointer; border-radius: 6px;
      border: 2px solid transparent;
      overflow: hidden; background: #12172a;
      transition: border-color .2s, transform .2s;
    }
    .thumb:hover { transform: translateY(-2px); }
    .thumb.active { border-color: var(--accent); }
    .thumb canvas { display: block; width: 100%; height: auto; }
    .thumb-num { font-size: 10px; text-align: center; color: var(--muted); padding: 3px 0; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 80px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; border-radius: 100px;
      padding: 9px 22px; font-size: 0.82rem; font-weight: 600;
      z-index: 200; opacity: 0; pointer-events: none;
      transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .3s;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Drawer overlay */
    #overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
    }
    #overlay.open { display: block; }

    @media (max-width:520px) {
      .share-row input { width: 120px; }
      .nav-btn { padding: 7px 10px; font-size: 0.75rem; }
    }
  </style>
</head>
<body>

<div id="app">

  <!-- Top bar -->
  <div id="topbar">
    <div class="title-block">
      <h1>Banking Service Supply Chain</h1>
      <span>Use ← → keys or swipe to navigate</span>
    </div>
  </div>

  <!-- Progress bar -->
  <div id="prog-wrap"><div id="prog-bar"></div></div>

  <!-- Slide area -->
  <div id="slide-area">
    <div id="loader"><div class="spinner"></div><p>Loading…</p></div>
    <canvas id="pdf-canvas"></canvas>
  </div>

  <!-- Bottom controls -->
  <div id="controls">
    <button class="nav-btn" id="btn-first" onclick="goToPage(1)">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
    </button>
    <button class="nav-btn" id="btn-prev" onclick="prevPage()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Prev
    </button>

    <div class="page-pill" id="page-pill" onclick="toggleDrawer()" title="View all slides">— / —</div>

    <button class="nav-btn" id="btn-next" onclick="nextPage()">
      Next
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button class="nav-btn" id="btn-last" onclick="goToPage(totalPages)">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
    </button>

    <button class="nav-btn" onclick="toggleDrawer()" title="All slides" style="margin-left:4px">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Slides
    </button>

    <div class="share-row" style="margin-left:4px">
      <input id="share-url" type="text" readonly value="" />
      <button class="copy-btn" onclick="copyLink()">Copy Link</button>
    </div>
  </div>

</div><!-- /#app -->

<!-- Thumbnail drawer -->
<div id="overlay" onclick="closeDrawer()"></div>
<div id="thumb-drawer">
  <div class="drawer-header">
    <span>All Slides</span>
    <button class="close-drawer" onclick="closeDrawer()">✕</button>
  </div>
  <div class="thumb-scroll" id="thumb-strip"></div>
</div>

<div id="toast">✓ Link copied!</div>

<script type="module">
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.worker.min.mjs';

  const canvas   = document.getElementById('pdf-canvas');
  const ctx      = canvas.getContext('2d');
  const loader   = document.getElementById('loader');
  const slideArea = document.getElementById('slide-area');

  window.totalPages = 0;
  let currentPage   = 1;
  let pdfDoc        = null;
  let rendering     = false;
  let pendingPage   = null;

  document.getElementById('share-url').value = location.href.split('?')[0];

  pdfjsLib.getDocument('./presentation.pdf').promise.then(doc => {
    pdfDoc = doc;
    window.totalPages = doc.numPages;
    const p = parseInt(new URLSearchParams(location.search).get('page')) || 1;
    currentPage = Math.min(Math.max(p, 1), window.totalPages);
    renderPage(currentPage);
    buildThumbnails();
    updateUI();
  }).catch(e => {
    loader.innerHTML = `<p style="color:#ff6b6b">Error: ${e.message}</p>`;
  });

  async function renderPage(num) {
    if (rendering) { pendingPage = num; return; }
    rendering = true;
    canvas.classList.add('fading');

    const page = await pdfDoc.getPage(num);
    const vp0  = page.getViewport({ scale: 1 });

    // Scale to fit slide-area dimensions with padding
    const aw = slideArea.clientWidth  - 32;
    const ah = slideArea.clientHeight - 32;
    const cssScale = Math.min(aw / vp0.width, ah / vp0.height, 3);
    
    // Account for high-DPI screens (Retina displays on phones)
    const pixelRatio = window.devicePixelRatio || 1;
    const renderScale = cssScale * pixelRatio;
    
    const vp = page.getViewport({ scale: renderScale });

    canvas.width  = vp.width;
    canvas.height = vp.height;
    
    // Keep CSS dimensions strictly to the calculated layout size
    canvas.style.width = `${vp.width / pixelRatio}px`;
    canvas.style.height = `${vp.height / pixelRatio}px`;

    await page.render({ canvasContext: ctx, viewport: vp }).promise;

    canvas.classList.remove('fading');
    loader.classList.add('hidden');
    rendering = false;

    const url = new URL(location);
    url.searchParams.set('page', num);
    history.replaceState(null, '', url);

    if (pendingPage !== null) {
      const n = pendingPage; pendingPage = null; renderPage(n);
    }
  }

  async function buildThumbnails() {
    const strip = document.getElementById('thumb-strip');
    for (let i = 1; i <= window.totalPages; i++) {
      const wrap = document.createElement('div');
      wrap.className = 'thumb' + (i === currentPage ? ' active' : '');
      wrap.dataset.page = i;

      const tc = document.createElement('canvas');
      const pg = await pdfDoc.getPage(i);
      const vp = pg.getViewport({ scale: 0.28 });
      tc.width = vp.width; tc.height = vp.height;
      await pg.render({ canvasContext: tc.getContext('2d'), viewport: vp }).promise;

      const lbl = document.createElement('div');
      lbl.className = 'thumb-num'; lbl.textContent = i;

      wrap.appendChild(tc); wrap.appendChild(lbl);
      wrap.addEventListener('click', () => { window.goToPage(i); closeDrawer(); });
      strip.appendChild(wrap);
    }
  }

  function updateUI() {
    document.getElementById('page-pill').textContent = `${currentPage} / ${window.totalPages}`;
    document.getElementById('btn-prev').disabled  = currentPage <= 1;
    document.getElementById('btn-first').disabled = currentPage <= 1;
    document.getElementById('btn-next').disabled  = currentPage >= window.totalPages;
    document.getElementById('btn-last').disabled  = currentPage >= window.totalPages;
    document.getElementById('prog-bar').style.width = `${(currentPage / window.totalPages) * 100}%`;

    document.querySelectorAll('.thumb').forEach(t => {
      const active = parseInt(t.dataset.page) === currentPage;
      t.classList.toggle('active', active);
      if (active) t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    });
  }

  window.goToPage = n => {
    if (!pdfDoc) return;
    currentPage = Math.min(Math.max(n, 1), window.totalPages);
    renderPage(currentPage); updateUI();
  };
  window.nextPage = () => window.goToPage(currentPage + 1);
  window.prevPage = () => window.goToPage(currentPage - 1);

  // Re-render on window resize so slide always fits
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => renderPage(currentPage), 200);
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') window.nextPage();
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   window.prevPage();
    if (e.key === 'Home') window.goToPage(1);
    if (e.key === 'End')  window.goToPage(window.totalPages);
    if (e.key === 'Escape') closeDrawer();
  });

  // Touch swipe
  let tx = 0;
  document.getElementById('slide-area').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  document.getElementById('slide-area').addEventListener('touchend',   e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 50) dx < 0 ? window.nextPage() : window.prevPage();
  }, { passive: true });
</script>

<script>
  function copyLink() {
    const url = document.getElementById('share-url').value;
    navigator.clipboard.writeText(url).then(() => {
      const t = document.getElementById('toast');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    });
  }

  function toggleDrawer() {
    const d = document.getElementById('thumb-drawer');
    const o = document.getElementById('overlay');
    if (d.classList.contains('open')) { closeDrawer(); }
    else { d.classList.add('open'); o.classList.add('open'); }
  }
  function closeDrawer() {
    document.getElementById('thumb-drawer').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }
</script>
</body>
</html>
